function haptic(pattern) {
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) { /* iOS Safari has no Vibration API — silently skip */ }

const root = document.getElementById('root');

function render() {
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;
  const scrollY = root.scrollTop;

  root.innerHTML = loaded ? renderRoot() : '<div class="loading">Loading your fleet…</div>';

  if (activeId) {
    const el = document.getElementById(activeId);
    if (el) {
      el.focus();
      if (selStart != null && el.setSelectionRange) { try { el.setSelectionRange(selStart, selEnd); } catch (e) {} }
    }
  }
  root.scrollTop = scrollY;
}
function renderRoot() {
  if (view.screen === 'documents') return renderDocumentsScreen(view.vehicleId);
  if (view.screen === 'folder') return renderFolderScreen(view.vehicleId, view.folder);

async function handleSaveVehicle(id) {
  const before = vehicles.find(v => v.id === id);
  const after = readVehicleFormFromDOM(id);
  const newLogEntries = [];
  for (const { key, label } of COMPLIANCE_TYPES) {
    const b = before ? before[key] : null;
    const a = after[key];
    if (a && a.amount != null && (!b || b.dueDate !== a.dueDate || b.amount !== a.amount)) {
      newLogEntries.push({ type: key, label, amount: a.amount, dueDate: a.dueDate, loggedAt: new Date().toISOString() });
    }
  }
  after.paymentLog = (before && before.paymentLog || []).concat(newLogEntries);
  await saveVehicleRemote(after);
  haptic(18);
  ui.justSaved[id] = true;
  render();
  setTimeout(() => { delete ui.justSaved[id]; render(); }, 1500);
}
async function handleArchiveToggle(id) {
  const v = vehicles.find(x => x.id === id);
  if (!v) return;
  haptic(15);

}
async function handleDeleteConfirmed(id) {

  haptic([20, 40, 20]);

}
async function handleRestoreVehicle(id) {

}
async function handlePermanentDelete(id) {

}
async function purgeOldTrash() {
  const cutoff = Date.now() - 30 * 24 * 60 * 60 * 1000;
  const toPurge = vehicles.filter(v => v.deletedAt && new Date(v.deletedAt).getTime() < cutoff);
  for (const v of toPurge) {
    try { await deleteVehicleRemote(v.id); } catch (e) { /* will retry next load */ }
  }
}
async function submitAddForm() {
  const num = document.getElementById('f_new_vehicleNo').value.trim().toUpperCase();
  if (!num) { ui.addError = 'Enter a vehicle number.'; haptic([15, 40, 15]); render(); return; }
  if (vehicles.some(v => v.vehicleNo === num)) { ui.addError = 'That vehicle number is already tracked.'; haptic([15, 40, 15]); render(); return; }
  const v = readVehicleFormFromDOM('new');
  v.id = makeId(); v.active = true; v.vehicleNo = num;
  await saveVehicleRemote(v);
  haptic(20);
  ui.addOpen = false; ui.addError = ''; delete lifetimeOverride['new'];
  render();
}
const uploadingFor = {}; // vehicleId -> true while an upload is in flight
const uploadError = {}; // vehicleId -> error message

async function handleUploadDocument(vehicleId, file, category) {
  if (!file) return;
  if (file.size > MAX_UPLOAD_BYTES) {
    uploadError[vehicleId] = `"${file.name}" is over 10MB — compress it or take a lighter-quality photo.`;
    haptic([15, 40, 15]);
    render();
    return;
  }
  uploadingFor[vehicleId] = true;
  uploadError[vehicleId] = '';
  render();
  try {
    const form = new FormData();
    form.append('file', file);
    form.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`, {
      method: 'POST',
      body: form,
    });
    if (!res.ok) throw new Error('Cloudinary upload failed: ' + res.status);
    const data = await res.json();
    const v = vehicles.find(x => x.id === vehicleId);
    const docs = (v.documents || []).concat([{
      name: file.name, url: data.secure_url, path: data.public_id, uploadedAt: new Date().toISOString(),
      category: category || 'receipt',
    }]);
    await saveVehicleRemote({ ...v, documents: docs });
    haptic(18);
  } catch (e) {
    uploadError[vehicleId] = 'Upload failed — check your connection and Cloudinary settings, then try again.';
    haptic([15, 40, 15]);
  } finally {
    uploadingFor[vehicleId] = false;
    render();
  }
}
async function handleDeleteDocument(vehicleId, path) {
  // Unsigned uploads can't be deleted from Cloudinary client-side (needs a signed request).
  // This removes it from the app's list; the file itself stays in your free Cloudinary storage, unused.
  const v = vehicles.find(x => x.id === vehicleId);
  if (!v) return;
  haptic(20);
  const docs = (v.documents || []).filter(d => d.path !== path);
  await saveVehicleRemote({ ...v, documents: docs });
}

async function handlePayDue(vehicleNo, btnEl) {

function quickRenew(id, field, months, btnEl) {

  dateInput.value = addMonthsClampEOM(dateInput.value || todayStr(), months);

  if (btnEl) {
    btnEl.dataset.prevValue = previousValue;
    btnEl.dataset.action = 'undo-quick-renew';

function exportBackup() {

  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `fleet-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);

// ---------------- event delegation ----------------
root.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  haptic(6); // a light tap on every actionable press, native-app style
  const action = btn.dataset.action;
  const id = btn.dataset.id;
  if (action === 'toggle-expand') { ui.expanded.has(id) ? ui.expanded.delete(id) : ui.expanded.add(id); render(); }
  else if (action === 'toggle-filter') { ui.filter = (ui.filter === btn.dataset.filter) ? 'all' : btn.dataset.filter; render(); }
  else if (action === 'toggle-add') { ui.addOpen = !ui.addOpen; ui.addError=''; render(); }
  else if (action === 'save-vehicle') { handleSaveVehicle(id); }
  else if (action === 'archive-toggle') { handleArchiveToggle(id); }
  else if (action === 'delete-request') { ui.confirmDelete[id] = true; render(); }
  else if (action === 'delete-cancel') { delete ui.confirmDelete[id]; render(); }
  else if (action === 'delete-confirm') { handleDeleteConfirmed(id); }
  else if (action === 'restore-vehicle') { handleRestoreVehicle(id); }
  else if (action === 'delete-forever') { handlePermanentDelete(id); }
  else if (action === 'open-spend') { navigateTo('spend'); }
  else if (action === 'share-dues') { handleShareDues(); }
  else if (action === 'enable-notifications') { handleEnableNotifications(); }
  else if (action === 'pay-due') { handlePayDue(btn.dataset.vehicleNo, btn); }
  else if (action === 'copy-chassis') { handleCopyChassis(btn.dataset.chassis, btn); }
  else if (action === 'quick-renew') { quickRenew(id, btn.dataset.field, Number(btn.dataset.months), btn); }
  else if (action === 'undo-quick-renew') { undoQuickRenew(id, btn.dataset.field, Number(btn.dataset.months), btn.dataset.label, btn); }
  else if (action === 'add-submit') { submitAddForm(); }
  else if (action === 'export-backup') { exportBackup(); }
  else if (action === 'open-documents') { navigateTo('documents', { vehicleId: id }); }
  else if (action === 'open-folder') { navigateTo('folder', { vehicleId: id, folder: btn.dataset.folder }); }
  else if (action === 'nav-back') { navigateBack(); }
  else if (action === 'upload-trigger') { const inp = document.getElementById(btn.dataset.inputId); if (inp) inp.click(); }
  else if (action === 'delete-document') { handleDeleteDocument(id, btn.dataset.path); }
  else if (action === 'download-document') { handleDownloadDocument(btn.dataset.url, btn.dataset.name, btn); }
});

async function handleDownloadDocument(url, name, btnEl) {
  const originalText = btnEl ? btnEl.textContent : '';
  if (btnEl) btnEl.textContent = '⬇ Downloading…';
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('fetch failed');
    const blob = await res.blob();
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = name || 'document';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(blobUrl), 2000);
  } catch (e) {
    // Fallback: open it directly if the fetch/blob approach fails for any reason
    window.open(url, '_blank');
  } finally {
    if (btnEl) btnEl.textContent = originalText;
  }
}

    ${list}
    <div style="margin-top:14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <button type="button" class="btn btn-primary" data-action="upload-trigger" data-id="${v.id}" data-input-id="${inputId}" ${isUploading ? 'disabled' : ''}>${isUploading ? 'Uploading…' : `⬆ Upload to ${folder.label}`}</button>
      <input type="file" id="${inputId}" data-doc-input data-id="${v.id}" data-category="${folder.key}" accept="image/*,application/pdf" style="display:none"/>
    </div>
    ${err ? `<div class="error-text" style="margin-top:8px">${escapeHtml(err)}</div>` : ''}
  </div>`;
}
function renderVehicleRow(v) {
  const isExpanded = ui.expanded.has(v.id);
  const worst = getVehicleWorstStatus(v);
  const wc = statusColors(worst.level);
  const dots = COMPLIANCE_TYPES.map(({ key, short, label }) => {
    const s = getComplianceStatus(v, key);
    const c = statusColors(s.level);
    return `<span class="status-dot" title="${escapeHtml(label)}: ${escapeHtml(s.label)}" style="background:${c.bg};border:1px solid ${c.border};color:${c.fg}">${short[0]}</span>`;
  }).join('');

  let expandHtml = '';
  if (isExpanded) {
    const confirming = !!ui.confirmDelete[v.id];
    expandHtml = `<div class="expand-body">
      <div class="field-grid">
        <div class="field"><label>Vehicle number<input class="text-input" id="f_${v.id}_vehicleNo" value="${escapeHtml(v.vehicleNo)}"/></label></div>
        <div class="field"><label>Chassis number<input class="text-input" id="f_${v.id}_chassisNo" value="${escapeHtml(v.chassisNo || '')}"/></label></div>
      </div>
      ${renderTaxField(v, v.id)}
      ${renderSimpleField(v, v.id, 'insurance', 'Insurance', 12, '+1 yr')}
      ${renderSimpleField(v, v.id, 'fitness', 'Fitness Certificate', null, null)}
      ${renderSimpleField(v, v.id, 'puc', 'PUC Certificate', 6, '+6 mo')}
      ${renderDocumentsNavButton(v)}
      <div class="field"><label>Notes<input class="text-input" id="f_${v.id}_notes" value="${escapeHtml(v.notes || '')}" placeholder="Driver, route, or any note"/></label></div>
      <div class="actions-row">
        <div class="actions-left">
          ${confirming
            ? `<span class="error-text">Delete for good?</span>
               <button class="btn btn-danger-filled" data-action="delete-confirm" data-id="${v.id}">Yes, delete</button>
               <button class="btn btn-outline" data-action="delete-cancel" data-id="${v.id}">Cancel</button>`
            : `<button class="btn btn-danger-text" data-action="delete-request" data-id="${v.id}">🗑 Delete</button>
               <button class="btn btn-outline" data-action="archive-toggle" data-id="${v.id}">${v.active ? '📦 Archive' : '↻ Restore'}</button>`
          }
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          ${ui.justSaved[v.id] ? `<span class="saved-flash">Saved</span>` : ''}
          <button class="btn btn-primary" data-action="save-vehicle" data-id="${v.id}">✓ Save changes</button>
        </div>
      </div>
    </div>`;
  }

  return `<div class="vehicle-row${isExpanded ? ' expanded' : ''}${!v.active ? ' inactive' : ''}">
    <button class="row-summary" data-action="toggle-expand" data-id="${v.id}">
      ${renderPlate(v.vehicleNo)}
      <div class="row-mid">
        ${v.active
          ? `<div class="row-status" style="color:${wc.fg}">${worst.level === 'unset' ? 'No dates set yet' : `${escapeHtml(worst.typeLabel)} · ${escapeHtml(worst.label)}`}</div>`
          : `<div class="row-status" style="color:#8A93A3">Archived${v.notes ? ` · ${escapeHtml(v.notes)}` : ''}</div>`
        }
        ${v.chassisNo ? `<div class="row-chassis">Chassis ${escapeHtml(v.chassisNo)}</div>` : ''}
      </div>
      <div class="status-dots">${dots}</div>
      <svg class="chevron${isExpanded ? ' open' : ''}" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </button>
    ${expandHtml}
  </div>`;
}
function renderAddForm() {
  if (!ui.addOpen) return `<button class="btn btn-outline add-toggle-btn" data-action="toggle-add">+ Add vehicle</button>`;
  return `<div class="add-form">
    <div class="add-form-title">Add a vehicle</div>
    <div class="field-grid">
      <div class="field"><label>Vehicle number *<input class="text-input" id="f_new_vehicleNo" placeholder="CG16XX1234"/></label></div>
      <div class="field"><label>Chassis number<input class="text-input" id="f_new_chassisNo"/></label></div>
    </div>
    ${renderTaxField(null, 'new')}
    ${renderSimpleField(null, 'new', 'insurance', 'Insurance', 12, '+1 yr')}
    ${renderSimpleField(null, 'new', 'fitness', 'Fitness Certificate', null, null)}
    ${renderSimpleField(null, 'new', 'puc', 'PUC Certificate', 6, '+6 mo')}
    <div class="field"><label>Notes<input class="text-input" id="f_new_notes" placeholder="Driver, route, or any note"/></label></div>
    ${ui.addError ? `<div class="error-text">${escapeHtml(ui.addError)}</div>` : ''}
    <div style="display:flex;justify-content:flex-end;gap:8px">
      <button class="btn btn-outline" data-action="toggle-add">Cancel</button>
      <button class="btn btn-primary" data-action="add-submit">+ Add vehicle</button>
    </div>
  </div>`;
}
function daysAgo(isoString) {
  const then = new Date(isoString).getTime();
  return Math.max(0, Math.floor((Date.now() - then) / 86400000));
}
function renderTrashRow(v) {
  const confirming = !!ui.confirmDelete[v.id];
  const days = daysAgo(v.deletedAt);
  return `<div class="vehicle-row inactive">
    <div class="row-summary" style="cursor:default">
      ${renderPlate(v.vehicleNo)}
      <div class="row-mid">
        <div class="row-status" style="color:#8A93A3">Deleted ${days === 0 ? 'today' : `${days}d ago`} · auto-removed after 30d</div>
        ${v.chassisNo ? `<div class="row-chassis">Chassis ${escapeHtml(v.chassisNo)}</div>` : ''}
      </div>
      <div class="actions-left">
        ${confirming
          ? `<span class="error-text" style="margin-right:4px">Forever?</span>
             <button class="btn btn-danger-filled" data-action="delete-forever" data-id="${v.id}">Yes</button>
             <button class="btn btn-outline" data-action="delete-cancel" data-id="${v.id}">Cancel</button>`
          : `<button class="btn btn-outline" data-action="restore-vehicle" data-id="${v.id}">↻ Restore</button>
             <button class="btn btn-danger-text" data-action="delete-request" data-id="${v.id}">🗑</button>`
        }
      </div>
    </div>
  </div>`;
}
function computeAnnualSpend(year) {
  const perVehicle = [];
  const byType = { tax: 0, insurance: 0, fitness: 0, puc: 0 };
  let total = 0;
  for (const v of vehicles) {
    if (v.deletedAt) continue;
    let vTotal = 0;
    for (const entry of (v.paymentLog || [])) {
      const entryYear = new Date(entry.loggedAt).getFullYear();
      if (entryYear !== year) continue;
      vTotal += entry.amount;
      byType[entry.type] = (byType[entry.type] || 0) + entry.amount;
      total += entry.amount;
    }
    if (vTotal > 0) perVehicle.push({ vehicleNo: v.vehicleNo, total: vTotal });
  }
  perVehicle.sort((a, b) => b.total - a.total);
  return { total, byType, perVehicle };
}
function formatINR(n) { return '₹' + Math.round(n).toLocaleString('en-IN'); }
function renderSpendScreen() {
  const year = new Date().getFullYear();
  const { total, byType, perVehicle } = computeAnnualSpend(year);
  const typeRows = COMPLIANCE_TYPES.map(({ key, label }) => `
    <div class="spend-row"><span>${label}</span><span>${formatINR(byType[key] || 0)}</span></div>`).join('');
  const vehicleRows = perVehicle.length === 0
    ? `<div class="empty-state" style="padding:20px 8px">No logged payments yet this year — totals fill in as you save renewed dates and amounts.</div>`
    : perVehicle.map(p => `<div class="spend-row"><span>${escapeHtml(p.vehicleNo)}</span><span>${formatINR(p.total)}</span></div>`).join('');
  return `<div class="wrap screen-enter">
    ${renderScreenHeader(`💰 Annual Spend`, `${year} · fleet-wide`)}
    <div class="spend-total-card">
      <div class="spend-total-label">Total logged this year</div>
      <div class="spend-total-num">${formatINR(total)}</div>
    </div>
    <div class="spend-section-title">By type</div>
    <div class="spend-card">${typeRows}</div>
    <div class="spend-section-title">By vehicle</div>
    <div class="spend-card">${vehicleRows}</div>
    <p class="spend-note">Tracking starts from when this update went live — amounts paid before that aren't in your original sheet, so they can't be counted retroactively. From now on, every saved renewal adds to these totals automatically.</p>
  </div>`;
}

function generateWeeklyDuesText() {
  const overdueLines = [];
  const dueLines = [];
  for (const v of vehicles.filter(x => x.active && !x.deletedAt)) {
    for (const { key, label } of COMPLIANCE_TYPES) {
      const s = getComplianceStatus(v, key);
      const amt = v[key] && v[key].amount != null ? ` (${formatINR(v[key].amount)})` : '';
      if (s.level === 'overdue') {
        overdueLines.push(`• ${v.vehicleNo} — ${label} ${s.label}${amt}`);
      } else if (s.level === 'soon' && s.days <= 7) {
        const dd = v[key].dueDate ? `, ${formatDateDisplay(v[key].dueDate)}` : '';
        dueLines.push(`• ${v.vehicleNo} — ${label} due in ${s.days}d${amt}${dd}`);
      }
    }
  }
  let body = `🚛 Fleet Compliance — Due This Week\n(as of ${formatDateDisplay(todayStr())})\n`;
  if (overdueLines.length) body += `\n⚠️ OVERDUE:\n${overdueLines.join('\n')}\n`;
  if (dueLines.length) body += `\n📅 DUE WITHIN 7 DAYS:\n${dueLines.join('\n')}\n`;
  if (!overdueLines.length && !dueLines.length) body += `\n✅ Nothing overdue or due within 7 days. All clear!\n`;
  return body;
}
async function handleEnableNotifications() {
  notifError = '';
  if (!messaging) { notifStatus = 'unsupported'; render(); return; }
  try {
    const permission = await Notification.requestPermission();
    notifStatus = permission;
    render();
    if (permission === 'granted') {
      const registration = await navigator.serviceWorker.register('firebase-messaging-sw.js');
      await navigator.serviceWorker.ready;
      const token = await getToken(messaging, { vapidKey: FCM_VAPID_KEY, serviceWorkerRegistration: registration });
      if (token) {
        await setDoc(doc(deviceTokensCol, token), { token, registeredAt: new Date().toISOString() });
        haptic(20);
      } else {
        notifError = 'No token came back from Firebase — permission was granted but registration didn\u2019t complete.';
      }
    }
  } catch (e) {
    notifError = `${e.name || 'Error'}: ${e.message || String(e)}`;
    console.error('Notification setup failed:', e);
  }
  render();
}
async function handleShareDues() {
  const text = generateWeeklyDuesText();
  haptic(15);
  if (navigator.share) {
    try { await navigator.share({ text }); return; } catch (e) { /* cancelled or unsupported — fall through */ }
  }
  try {
    await navigator.clipboard.writeText(text);
    shareState.text = text; shareState.mode = 'copied';
  } catch (e) {
    shareState.text = text; shareState.mode = 'fallback';
  }
  render();
  if (shareState.mode === 'copied') setTimeout(() => { shareState.text = ''; shareState.mode = ''; render(); }, 4000);
}
function renderNotifButton() {
  if (notifStatus === 'unsupported' || notifStatus === 'checking') return '';
  if (notifStatus === 'granted' && !notifError) return `<button type="button" class="btn btn-outline quick-action-btn" disabled style="opacity:0.6">🔔 Notifications on</button>`;
  if (notifStatus === 'denied') return `<button type="button" class="btn btn-outline quick-action-btn" disabled style="opacity:0.6">🔕 Blocked — check phone settings</button>`;
  const label = notifStatus === 'granted' ? '🔔 Retry registration' : '🔔 Enable Notifications';
  return `<button type="button" class="btn btn-primary quick-action-btn" data-action="enable-notifications">${label}</button>`;
}
function renderShareFallback() {
  const label = shareState.mode === 'copied' ? '✓ Copied to clipboard — paste it into WhatsApp' : 'Copy this manually:';
  return `<div class="share-fallback">
    <div class="share-fallback-label">${label}</div>
    <textarea readOnly onfocus="this.select()" class="text-input" style="height:120px;font-size:11.5px">${escapeHtml(shareState.text)}</textarea>
  </div>`;
}

function renderApp() {
  const activeVehicles = vehicles.filter(v => v.active && !v.deletedAt);
  const archivedVehicles = vehicles.filter(v => !v.active && !v.deletedAt);
  const trashVehicles = vehicles.filter(v => v.deletedAt).sort((a,b) => new Date(b.deletedAt) - new Date(a.deletedAt));
  const overdueCount = activeVehicles.filter(v => getVehicleWorstStatus(v).level === 'overdue').length;
  const soonCount = activeVehicles.filter(v => getVehicleWorstStatus(v).level === 'soon').length;
  const missingCount = activeVehicles.filter(v => COMPLIANCE_TYPES.some(({key}) => getComplianceStatus(v,key).level === 'unset')).length;

  if (ui.filter === 'trash') {
    return `<div class="wrap">
      <header>
        <div class="header-row"><h1 class="title">FLEET COMPLIANCE LOG</h1>${renderSyncBadge()}</div>
        <p class="subtitle">${activeVehicles.length} active · ${archivedVehicles.length} archived · shared live with everyone who opens this app</p>
      </header>
      <div class="stat-grid">
        ${renderStatBlock('Overdue', overdueCount, '#E5484D', 'overdue')}
        ${renderStatBlock('Due ≤ 30 days', soonCount, '#F2A93B', 'soon')}
        ${renderStatBlock('Needs info', missingCount, '#5B9FE3', 'missing')}
        ${renderStatBlock('Archived', archivedVehicles.length, '#5B6472', 'archived')}
        ${renderStatBlock('Trash', trashVehicles.length, '#E5484D', 'trash')}
      </div>
      <div class="vehicle-list">
        ${trashVehicles.length === 0 ? `<div class="empty-state">Trash is empty.</div>` : trashVehicles.map(renderTrashRow).join('')}
      </div>
    </div>`;
  }

  const pool = ui.filter === 'archived' ? archivedVehicles : activeVehicles;
  const filtered = pool.filter(v => {
    if (ui.filter === 'overdue' && getVehicleWorstStatus(v).level !== 'overdue') return false;
    if (ui.filter === 'soon' && getVehicleWorstStatus(v).level !== 'soon') return false;
    if (ui.filter === 'missing' && !COMPLIANCE_TYPES.some(({key}) => getComplianceStatus(v,key).level === 'unset')) return false;
    if (ui.search.trim()) {
      const q = ui.search.trim().toLowerCase();
      if (!v.vehicleNo.toLowerCase().includes(q) && !(v.chassisNo||'').toLowerCase().includes(q)) return false;
    }
    return true;
  }).sort((a,b) => {
    const wa = getVehicleWorstStatus(a), wb = getVehicleWorstStatus(b);
    if (STATUS_RANK[wa.level] !== STATUS_RANK[wb.level]) return STATUS_RANK[wa.level]-STATUS_RANK[wb.level];
    return (wa.days ?? Infinity) - (wb.days ?? Infinity);
  });

  return `<div class="wrap">
    <header>
      <div class="header-row"><h1 class="title">FLEET COMPLIANCE LOG</h1>${renderSyncBadge()}</div>
      <p class="subtitle">${activeVehicles.length} active · ${archivedVehicles.length} archived · shared live with everyone who opens this app</p>
    </header>
    <div class="stat-grid">
      ${renderStatBlock('Overdue', overdueCount, '#E5484D', 'overdue')}
      ${renderStatBlock('Due ≤ 30 days', soonCount, '#F2A93B', 'soon')}
      ${renderStatBlock('Needs info', missingCount, '#5B9FE3', 'missing')}
      ${renderStatBlock('Archived', archivedVehicles.length, '#5B6472', 'archived')}
      ${renderStatBlock('Trash', trashVehicles.length, '#E5484D', 'trash')}
    </div>
    <div class="quick-actions">
      <button type="button" class="btn btn-outline quick-action-btn" data-action="open-spend">💰 Annual Spend</button>
      <button type="button" class="btn btn-outline quick-action-btn" data-action="share-dues">📤 Share this week's dues</button>
      ${renderNotifButton()}
    </div>
    ${notifError ? `<div class="error-text" style="margin-bottom:12px">🔔 ${escapeHtml(notifError)}</div>` : ''}
    ${foregroundNotice ? `<div class="foreground-notice">🔔 ${escapeHtml(foregroundNotice)}</div>` : ''}
    ${shareState.text ? renderShareFallback() : ''}
    <div class="search-wrap">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search-input" class="text-input" placeholder="Search by vehicle or chassis number" value="${escapeHtml(ui.search)}"/>
    </div>
    <div class="vehicle-list">
      ${filtered.length === 0 ? `<div class="empty-state">${emptyStateMessage(ui.filter, ui.search)}</div>` : filtered.map(renderVehicleRow).join('')}
    </div>
    <div style="margin-top:14px">${renderAddForm()}</div>
    <div class="backup-note">
      <span>Want a local safety-net copy?</span>
      <button class="btn btn-outline" data-action="export-backup">⬇ Export backup</button>
    </div>
    <div class="legend">
      <span class="legend-item"><span class="legend-dot" style="background:#E5484D"></span>Overdue</span>
      <span class="legend-item"><span class="legend-dot" style="background:#F2A93B"></span>Due ≤ 30d</span>
      <span class="legend-item"><span class="legend-dot" style="background:#5B9FE3"></span>Due ≤ 90d</span>
      <span class="legend-item"><span class="legend-dot" style="background:#3FB27F"></span>On track / Lifetime</span>
      <span class="legend-item"><span class="legend-dot" style="background:#5B6472"></span>Not set</span>
    </div>
  </div>`;
}

// ---------------- init ----------------
(async () => {
  try {
    await ensureSeeded();
  } catch (e) {
    console.error('Seeding failed — check your Firebase config and Firestore rules.', e);
  }
  subscribe();
})();
</script>
