<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Fleet Compliance Log</title>
<meta name="theme-color" content="#12161C" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap');
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #12161C; color: #EDEFF2; font-family: 'Inter', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: contain; }
  body { padding: 18px 14px 40px; -webkit-font-smoothing: antialiased; }
  ::placeholder { color: #5B6472; }
  input:focus-visible, button:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid #F4C41E; outline-offset: 2px; }
  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.7); cursor: pointer; }
  .wrap { max-width: 720px; margin: 0 auto; }
  .header-row { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 6px; }
  .title { font-family: 'JetBrains Mono', monospace; font-size: clamp(16px, 4.5vw, 20px); font-weight: 800; letter-spacing: -0.02em; margin: 0; }
  .subtitle { font-size: 12.5px; color: #8A93A3; margin: 4px 0 16px; }
  .sync-live { color: #3FB27F; font-size: 11px; display: inline-flex; align-items: center; gap: 4px; }
  .sync-connecting { color: #8A93A3; font-size: 11px; }
  .sync-offline { color: #F2A93B; font-size: 11px; }
  .sync-error { color: #E5484D; font-size: 11px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; background: currentColor; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-bottom: 14px; }
  .stat-block { text-align: left; cursor: pointer; background: #1B212B; border: 1px solid #2B3441; border-radius: 7px; padding: 10px 12px; font: inherit; color: inherit; }
  .stat-block.active { background: #232B37; }
  .stat-num { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: clamp(20px, 6vw, 26px); line-height: 1.1; }
  .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #8A93A3; margin-top: 2px; font-weight: 600; }
  .search-wrap { position: relative; margin-bottom: 12px; }
  .search-icon { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: #5B6472; pointer-events: none; }
  .text-input, .date-input, .number-input, .select-input, textarea { background: #12161C; border: 1px solid #2B3441; border-radius: 6px; padding: 7px 9px; color: #EDEFF2; font-size: 13px; font-family: 'Inter', sans-serif; outline: none; width: 100%; }
  .date-input { width: auto; min-width: 140px; font-family: 'JetBrains Mono', monospace; color-scheme: dark; }
  .number-input { width: 118px; }
  .select-input { width: auto; min-width: 110px; color-scheme: dark; }
  #search-input { padding-left: 29px; }
  .vehicle-list { display: flex; flex-direction: column; gap: 8px; }
  .vehicle-row { background: #1B212B; border: 1px solid #2B3441; border-radius: 8px; overflow: hidden; }
  .vehicle-row.expanded { border-color: #3A4553; }
  .vehicle-row.inactive { opacity: 0.6; }
  .row-summary { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: transparent; border: none; cursor: pointer; text-align: left; font: inherit; color: inherit; }
  .plate-chip { display: inline-flex; align-items: stretch; border-radius: 5px; overflow: hidden; border: 2px solid #24242A; box-shadow: 0 1px 2px rgba(0,0,0,0.45); flex-shrink: 0; }
  .plate-tab { width: 5px; background: #155EA8; }
  .plate-text { background: #F4C41E; color: #15161A; font-family: 'JetBrains Mono', monospace; font-weight: 800; padding: 4px 8px; letter-spacing: 0.5px; font-size: 13px; white-space: nowrap; }
  .row-mid { flex: 1; min-width: 0; }
  .row-name { font-family: 'JetBrains Mono', monospace; font-size: 12.5px; font-weight: 700; letter-spacing: 0.2px; color: #F4C41E; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px; }
  .row-status { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row-chassis { font-size: 10.5px; color: #5B6472; margin-top: 1px; }
  .status-dots { display: flex; gap: 4px; flex-shrink: 0; }
  .status-dot { width: 18px; height: 18px; border-radius: 5px; font-size: 8px; font-weight: 800; display: flex; align-items: center; justify-content: center; letter-spacing: -0.3px; }
  .chevron { flex-shrink: 0; transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1); color: #5B6472; }
  .chevron.open { transform: rotate(180deg); }
  .expand-body { padding: 12px 12px 14px; border-top: 1px solid #2B3441; display: flex; flex-direction: column; gap: 10px; animation: fadeSlide 0.18s cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes fadeSlide { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  .expand-body.closing { animation: fadeSlideOut 0.14s ease-in forwards; pointer-events: none; }
  @keyframes fadeSlideOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-6px); } }
  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .field label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: #8A93A3; font-weight: 600; }
  .compliance-block { background: #161B22; border: 1px solid #262E39; border-radius: 7px; padding: 9px 10px; }
  .compliance-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; gap: 8px; flex-wrap: wrap; }
  .compliance-label { font-size: 12px; font-weight: 700; color: #C3CAD4; }
  .compliance-date-hint { font-size: 10.5px; color: #5B6472; }
  .status-pill { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .checkbox-row { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: #8A93A3; margin-bottom: 7px; cursor: pointer; }
  .addon-section { border: 1px dashed #3A4553; border-radius: 8px; padding: 9px 10px; }
  .addon-section .addon-toggle { margin-bottom: 0; font-size: 12px; font-weight: 600; color: #C3CAD4; }
  .addon-section .compliance-block { margin-top: 9px; }
  .addon-hint { font-weight: 500; color: #5B6472; font-size: 11px; }
  .hold-btn { background: transparent; border: 1px solid #3A4553; color: #8A93A3; border-radius: 6px; padding: 3px 8px; font-size: 11px; font-weight: 600; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .hold-btn.active { background: rgba(155,140,255,0.16); border-color: rgba(155,140,255,0.5); color: #9B8CFF; }
  .compliance-block.on-hold .row-fields { opacity: 0.5; }
  .penalty-tick { margin: 0; white-space: nowrap; }
  .penalty-amt { width: 120px; }
  .penalty-total { font-size: 11px; color: #F4C41E; margin-top: 6px; }
  .penalty-help { font-size: 10.5px; color: #8A93A3; margin-top: 4px; }
  .tx-pen { color: #E5484D; font-weight: 600; }
  .row-fields { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .quick-btn, .btn { display: inline-flex; align-items: center; gap: 5px; border-radius: 6px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .quick-btn { background: transparent; border: 1px dashed #3A4553; color: #8A93A3; padding: 6px 8px; font-size: 11px; }
  .btn-outline { background: transparent; border: 1px solid #3A4553; color: #C3CAD4; padding: 7px 11px; font-size: 12px; }
  .btn-primary { background: #F4C41E; border: 1px solid #F4C41E; color: #15161A; padding: 7px 13px; font-size: 12.5px; }
  .btn-danger-text { background: transparent; border: 1px solid transparent; color: #E5484D; padding: 7px 9px; font-size: 12px; }
  .btn-danger-filled { background: rgba(229,72,77,0.15); border: 1px solid #E5484D; color: #E5484D; padding: 7px 9px; font-size: 12px; }
  .actions-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
  .actions-left { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .saved-flash { font-size: 11px; color: #3FB27F; animation: fadeSlide 0.2s ease-out; }
  .add-form { background: #1B212B; border: 1px solid #F4C41E; border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .add-form-title { font-size: 13px; font-weight: 700; }
  .add-toggle-btn { width: 100%; justify-content: center; padding: 10px; border-style: dashed; }
  .error-text { font-size: 12px; color: #E5484D; }
  .empty-state { text-align: center; padding: 28px 12px; color: #5B6472; font-size: 13px; }
  .legend { margin-top: 22px; display: flex; gap: 14px; flex-wrap: wrap; font-size: 10.5px; color: #5B6472; }
  .legend-item { display: inline-flex; align-items: center; gap: 5px; }
  .legend-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .backup-note { margin-top: 18px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 11.5px; color: #5B6472; }
  .loading { min-height: 60vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; color: #5B6472; font-size: 13px; }
  .spinner { width: 30px; height: 30px; border-radius: 50%; border: 3px solid #2B3441; border-top-color: #F4C41E; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* login */
  .login-wrap { min-height: 80vh; display: flex; align-items: center; justify-content: center; }
  .login-card { width: 100%; max-width: 380px; background: #1B212B; border: 1px solid #2B3441; border-top: 3px solid #F4C41E; border-radius: 12px; padding: 22px 20px; }
  .login-card .subtitle { margin-bottom: 14px; }
  .login-plate { margin-bottom: 14px; }
  .login-form { display: flex; flex-direction: column; gap: 12px; }
  .login-form label { display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; color: #8A93A3; font-weight: 600; }
  .login-form .text-input { padding: 10px 11px; font-size: 14px; }
  .pw-row { display: flex; gap: 6px; }
  .login-submit { width: 100%; justify-content: center; padding: 11px; font-size: 13.5px; }
  .menu-role { padding: 9px 10px 8px; font-size: 12px; color: #8A93A3; border-bottom: 1px solid #2B3441; margin-bottom: 4px; line-height: 1.45; }
  .menu-role strong { color: #F4C41E; font-size: 13px; }
  .menu-item.logout { color: #E5484D; }
  /* view-only accounts: fields stay readable but can't be changed */
  .expand-body input:disabled, .expand-body select:disabled { opacity: 0.9; cursor: default; -webkit-text-fill-color: #EDEFF2; }
  .expand-body input[type="checkbox"]:disabled { opacity: 0.6; }

  /* tactile press feedback across all interactive elements */
  button, .stat-block, .row-summary, .doc-row-name, .folder-tile, .docs-nav-btn, .menu-item, .menu-btn, .back-btn {
    transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.1s ease, background-color 0.15s ease;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  button:active:not(:disabled), .stat-block:active, .row-summary:active, .folder-tile:active, .docs-nav-btn:active, .menu-item:active, .menu-btn:active, .back-btn:active {
    transform: scale(0.96);
    opacity: 0.85;
    transition: transform 0.06s ease-out, opacity 0.06s ease-out;
  }

  /* screen navigation (Documents / Folder views) */
  .screen-enter { animation: screenSlideIn 0.22s cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes screenSlideIn { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: translateX(0); } }
  .screen-enter-back { animation: screenSlideInBack 0.22s cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes screenSlideInBack { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: translateX(0); } }
  .screen-header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .back-btn { background: #1B212B; border: 1px solid #2B3441; color: #EDEFF2; width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .screen-title { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 800; }
  .screen-subtitle { font-size: 11.5px; color: #8A93A3; margin-top: 1px; }

  .docs-nav-btn { width: 100%; justify-content: space-between; display: flex; align-items: center; }
  .docs-nav-count { background: #12161C; border: 1px solid #2B3441; border-radius: 999px; padding: 1px 9px; font-size: 11px; color: #8A93A3; font-weight: 700; margin-left: auto; margin-right: 8px; }
  .docs-nav-chevron { color: #5B6472; font-size: 16px; }

  .folder-grid { display: flex; flex-direction: column; gap: 10px; }
  .folder-tile { display: flex; align-items: center; gap: 12px; background: #1B212B; border: 1px solid #2B3441; border-radius: 10px; padding: 16px; cursor: pointer; text-align: left; width: 100%; }
  .folder-icon { font-size: 26px; width: 46px; height: 46px; background: #161B22; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .folder-info { flex: 1; min-width: 0; }
  .folder-label { font-size: 14.5px; font-weight: 700; color: #EDEFF2; }
  .folder-hint { font-size: 11px; color: #8A93A3; margin-top: 1px; }
  .folder-count { background: #F4C41E; color: #15161A; border-radius: 999px; min-width: 22px; height: 22px; padding: 0 7px; display: flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 800; flex-shrink: 0; }
  .folder-chevron { color: #5B6472; font-size: 18px; flex-shrink: 0; }

  .type-section { margin-bottom: 12px; }
  .type-section .folder-tile { padding: 12px 14px; }
  .type-section .folder-icon { width: 38px; height: 38px; font-size: 20px; }
  .folder-tile.section-overdue { border-left: 3px solid #E5484D; }
  .folder-tile.section-soon { border-left: 3px solid #F2A93B; }
  .section-chev { transition: transform 0.2s ease; }
  .section-chev.open { transform: rotate(90deg); }
  .section-body { display: flex; flex-direction: column; gap: 8px; margin: 8px 0 2px 10px; padding-left: 10px; border-left: 2px solid #2B3441; }
  .doc-list { display: flex; flex-direction: column; gap: 8px; }
  .doc-row { display: flex; align-items: center; gap: 8px; background: #1B212B; border: 1px solid #2B3441; border-radius: 8px; padding: 11px 12px; }
  .doc-row-name { background: none; border: none; color: #5B9FE3; font-size: 13px; cursor: pointer; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; padding: 0; font-family: inherit; }
  .doc-row-date { font-size: 10.5px; color: #5B6472; flex-shrink: 0; }
  .doc-row-delete { padding: 4px 8px; font-size: 12px; flex-shrink: 0; }

  .quick-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .quick-action-btn { flex: 1; min-width: 150px; justify-content: center; }
  .share-fallback { background: #1B212B; border: 1px solid #2B3441; border-radius: 8px; padding: 10px; margin-bottom: 12px; }
  .share-fallback-label { font-size: 11.5px; color: #8A93A3; margin-bottom: 6px; }

  .spend-total-card { background: linear-gradient(135deg, #1B212B, #232B37); border: 1px solid #2B3441; border-top: 3px solid #F4C41E; border-radius: 10px; padding: 18px; margin-bottom: 18px; text-align: center; }
  .spend-total-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #8A93A3; font-weight: 600; }
  .spend-total-num { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: clamp(28px, 8vw, 38px); color: #F4C41E; margin-top: 4px; }
  .spend-section-title { font-size: 12px; font-weight: 700; color: #C3CAD4; text-transform: uppercase; letter-spacing: 0.5px; margin: 16px 0 8px; }
  .spend-card { background: #1B212B; border: 1px solid #2B3441; border-radius: 8px; overflow: hidden; }
  .spend-row { display: flex; justify-content: space-between; padding: 11px 14px; font-size: 13px; border-bottom: 1px solid #232B37; font-family: 'JetBrains Mono', monospace; }
  .spend-row:last-child { border-bottom: none; }
  .spend-note { font-size: 11.5px; color: #5B6472; margin-top: 16px; line-height: 1.5; }
  .spend-row.zero { color: #5B6472; }
  .recheck-nav-btn { width: 100%; justify-content: space-between; display: flex; align-items: center; margin-bottom: 4px; }
  .recheck-badge { background: #F2A93B; color: #15161A; border-radius: 999px; min-width: 22px; height: 22px; padding: 0 7px; display: inline-flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 800; margin-left: auto; margin-right: 8px; }
  .recheck-badge.zero { background: #12161C; color: #8A93A3; border: 1px solid #2B3441; }
  .recheck-list { display: flex; flex-direction: column; gap: 10px; }
  .recheck-card { background: #1B212B; border: 1px solid #2B3441; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .recheck-card.voided { opacity: 0.7; border-style: dashed; }
  .recheck-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .recheck-amount { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 15px; }
  .recheck-amount.voided { text-decoration: line-through; color: #5B6472; }
  .recheck-meta { font-size: 11.5px; color: #8A93A3; line-height: 1.5; }
  .reason-tag { display: inline-block; font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: rgba(242,169,59,0.14); border: 1px solid rgba(242,169,59,0.35); color: #F2A93B; margin: 2px 4px 0 0; }
  .reason-tag.void { background: rgba(229,72,77,0.14); border-color: rgba(229,72,77,0.35); color: #E5484D; }
  .spend-tile-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 4px; }
  .spend-tile-amount { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: 13.5px; color: #F4C41E; flex-shrink: 0; }
  .spend-tile-amount.zero { color: #5B6472; }
  .month-tile.zero, .vehicle-tile.zero { opacity: 0.6; }
  .tx-card { background: #1B212B; border: 1px solid #2B3441; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .tx-card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .tx-line { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; padding-top: 7px; border-top: 1px solid #232B37; }
  .tx-line-main { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .tx-line-sub { font-size: 10.5px; color: #5B6472; }
  .tx-line-amt { font-family: 'JetBrains Mono', monospace; font-weight: 700; flex-shrink: 0; }
  .tx-line.voided { opacity: 0.55; }
  .tx-line.voided .tx-line-amt { text-decoration: line-through; }
  .tx-month-title { font-size: 12px; font-weight: 700; color: #C3CAD4; text-transform: uppercase; letter-spacing: 0.5px; margin: 16px 0 8px; display: flex; justify-content: space-between; }
  .foreground-notice { background: rgba(91,159,227,0.14); border: 1px solid rgba(91,159,227,0.35); color: #5B9FE3; border-radius: 7px; padding: 10px 12px; font-size: 12.5px; margin-bottom: 12px; animation: fadeSlide 0.2s ease-out; }
  .notif-debug { background: #161B22; border: 1px solid #262E39; border-radius: 7px; padding: 10px 12px; margin-bottom: 12px; font-size: 11.5px; color: #8A93A3; line-height: 1.6; animation: fadeSlide 0.2s ease-out; }
  .notif-debug-title { font-weight: 700; color: #C3CAD4; margin-bottom: 4px; }
  .notif-success { background: rgba(63,178,127,0.14); border: 1px solid rgba(63,178,127,0.35); color: #3FB27F; border-radius: 7px; padding: 10px 12px; font-size: 12.5px; margin-bottom: 12px; animation: fadeSlide 0.2s ease-out; }
  .menu-wrap { position: relative; }
  .menu-btn { background: #1B212B; border: 1px solid #2B3441; color: #EDEFF2; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 17px; line-height: 1; flex-shrink: 0; }
  .menu-dropdown { position: absolute; right: 0; top: 38px; background: #1B212B; border: 1px solid #2B3441; border-radius: 8px; padding: 6px; min-width: 230px; z-index: 30; box-shadow: 0 8px 24px rgba(0,0,0,0.45); transform-origin: top right; animation: menuPop 0.14s cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes menuPop { from { opacity: 0; transform: scale(0.92) translateY(-4px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  .menu-item { width: 100%; text-align: left; background: transparent; border: none; color: #EDEFF2; padding: 9px 10px; border-radius: 6px; font-size: 12.5px; cursor: pointer; display: block; font-family: inherit; }
  .menu-item:not(:disabled):hover { background: #232B37; }
  .menu-item:disabled { color: #5B6472; cursor: default; opacity: 0.8; }

  if (authState !== 'signedIn' || isModerator()) return;
  const sel = EDIT_ACTIONS.map(a => `[data-action="${a}"]`).join(',') + ',[data-doc-input]';
  root.querySelectorAll(sel).forEach(el => el.remove());
  root.querySelectorAll('.expand-body input, .expand-body select, .expand-body textarea').forEach(el => { el.disabled = true; });
  // "Track Permit on this vehicle" is just clutter for a vehicle that doesn't use it.
  root.querySelectorAll('.addon-section').forEach(sec => {
    const cb = sec.querySelector('[data-permit-checkbox]');
    if (cb && !cb.checked) sec.remove();
  });
  root.querySelectorAll('.penalty-tick').forEach(l => { const c = l.querySelector('input'); if (c && !c.checked) l.remove(); });
  root.querySelectorAll('.actions-row').forEach(r => { if (!r.querySelector('button')) r.remove(); });
}

// ---------------- form reading helpers ----------------
function readVehicleFormFromDOM(id) {
  const existing = vehicles.find(v => v.id === id) || { id, active: true, documents: [] };
  const g = (f) => document.getElementById(`f_${id}_${f}`);
  const isLT = g('tax_lifetime').checked;
  const holdOf = (k) => !!(g(k + '_hold') && g(k + '_hold').dataset.hold === '1');
  return {
    id: existing.id,
    active: existing.active,
    documents: existing.documents || [],
    vehicleNo: g('vehicleNo').value.trim().toUpperCase(),
    name: g('name').value.trim(),
    chassisNo: g('chassisNo').value.trim(),
    notes: g('notes').value.trim(),
    tax: isLT
      ? { isLifetime: true, dueDate: null, amount: null, lifetimeNote: g('tax_note').value.trim(), hold: false, penalty: null }
      : { isLifetime: false, dueDate: g('tax_date').value || null, amount: g('tax_amount').value === '' ? null : Number(g('tax_amount').value), lifetimeNote: '', hold: holdOf('tax'), penalty: (g('tax_penalty_on') && g('tax_penalty_on').checked && Number(g('tax_penalty').value) > 0) ? Number(g('tax_penalty').value) : null },
    insurance: { dueDate: g('insurance_date').value || null, amount: g('insurance_amount').value === '' ? null : Number(g('insurance_amount').value), hold: holdOf('insurance') },
    fitness: { dueDate: g('fitness_date').value || null, amount: g('fitness_amount').value === '' ? null : Number(g('fitness_amount').value), hold: holdOf('fitness') },
    puc: { dueDate: g('puc_date').value || null, amount: g('puc_amount').value === '' ? null : Number(g('puc_amount').value), hold: holdOf('puc') },
    // Permit fields are always read (the block is only hidden, not removed) so switching the
    // add-on off and on again doesn't lose what was typed.
    permit: {
      enabled: g('permit_enabled').checked,
      dueDate: g('permit_date').value || null,
      amount: g('permit_amount').value === '' ? null : Number(g('permit_amount').value),
      number: g('permit_number').value.trim(),
      type: g('permit_type').value || 'National',
      hold: holdOf('permit'),
    },
  };
}

// ---------------- payment log ----------------
// Each payment entry is tied to one vehicle + one compliance type + the due date it
// renewed the vehicle TO (e.g. tax paid in Oct -> due date 31 Dec).
//   status: 'active' (counts in Annual Spend) | 'void' (ignored in totals, kept for audit)
// Rules applied on every save:
//   - due date moved FORWARD with an amount  -> one entry for that type + due date
//     (saving the same date again updates that entry instead of adding a second one)
//   - due date moved BACK                    -> payments that pushed it past that date are voided
//   - same date, amount edited               -> amount of the existing entry is corrected
// Entries from older versions have no `status` and are treated as active.
function applyPaymentLogChanges(before, after) {
  const log = ((before && before.paymentLog) || []).map(e => ({ ...e }));
  const now = new Date().toISOString();
  for (const { key, label } of typesFor(after)) {
    const b = before ? before[key] : null;
    const a = after[key];
    if (!a || a.hold) continue; // on hold = not being paid, so nothing to log
    const bDate = b ? (b.dueDate || null) : null;
    const bAmt = b && b.amount != null ? b.amount : null;
    const aDate = a.dueDate || null;
    const aAmt = a.amount != null ? a.amount : null;
    if (bDate === aDate && bAmt === aAmt) continue; // nothing changed for this type

    const isActive = (e) => e.type === key && e.status !== 'void';

    // Date moved backwards -> undo the payments that had pushed it forward.
    if (aDate && bDate && aDate < bDate) {
      for (const e of log) {
        if (isActive(e) && e.dueDate && e.dueDate > aDate) {
          e.status = 'void';
          e.voidedAt = now;
          e.voidReason = `Due date moved back to ${formatDateDisplay(aDate)}`;
        }
      }
      continue;
    }

    if (aAmt == null || !aDate) continue; // no amount or no date -> nothing to log

    // RTO tax penalty (one-off, e.g. back-taxes on a second-hand vehicle): only applied when a
    // payment is actually being recorded (due date moved forward). It is added to that tax
    // payment and then cleared from the form so it never carries over to the next quarter.
    const paying = aDate !== bDate;
    const pen = key === 'tax' && paying && a.penalty > 0 ? a.penalty : 0;
    if (pen > 0) a.penalty = null;

    const existing = log.find(e => isActive(e) && e.dueDate === aDate);
    if (existing) {
      const newPen = pen > 0 ? pen : (existing.penalty || 0); // a plain amount correction keeps the penalty already logged
      const newAmt = aAmt + newPen;
      if (existing.amount !== newAmt) {
        existing.amount = newAmt;
        if (newPen > 0) existing.penalty = newPen; else delete existing.penalty;
        existing.edits = (existing.edits || 0) + 1;
        existing.lastEditedAt = now;
      } else if (aDate !== bDate) {
        // Moved to a due date that already has a payment logged -> saved again for the same period.
        existing.resaves = (existing.resaves || 0) + 1;
        existing.lastResavedAt = now;
      }
    } else if (aDate !== bDate) {
      const entry = { type: key, label, amount: aAmt + pen, dueDate: aDate, loggedAt: now, status: 'active' };
      if (pen > 0) entry.penalty = pen;
      log.push(entry);
    }
    // Same date, amount changed, no logged payment for it -> just a data correction, not a payment.
  }
  return log;
}

// ---------------- action handlers ----------------
async function handleSaveVehicle(id) {
  const before = vehicles.find(v => v.id === id);
  const after = readVehicleFormFromDOM(id);
  after.paymentLog = applyPaymentLogChanges(before, after);
  await saveVehicleRemote(after);
  haptic(18);
  ui.justSaved[id] = true;
  render();
  setTimeout(() => { delete ui.justSaved[id]; render(); }, 1500);
}
async function handleResetPaymentLog(id) {
  const v = vehicles.find(x => x.id === id);
  if (!v) return;
  // Rebuilds this vehicle's spend history from scratch using only its
  // currently-saved amounts — use this to clear out any stray entries left
  // over from repeated edits/testing before the logging fix above.
  const freshLog = [];
  for (const { key, label } of typesFor(v)) {
    const data = v[key];
    if (data && !data.hold && data.amount != null && data.dueDate) {
      freshLog.push({ type: key, label, amount: data.amount, dueDate: data.dueDate, loggedAt: new Date().toISOString(), status: 'active' });
    }
  }
  haptic(18);
  await saveVehicleRemote({ ...v, paymentLog: freshLog });
  delete ui.confirmResetLog[id];
  render();
}
async function handleToggleVoidEntry(vehicleId, idx) {
  const v = vehicles.find(x => x.id === vehicleId);
  if (!v || !v.paymentLog || !v.paymentLog[idx]) return;
  const log = v.paymentLog.map(e => ({ ...e }));
  const e = log[idx];
  if (e.status === 'void') {
    e.status = 'active';
    delete e.voidedAt;
    delete e.voidReason;
  } else {
    e.status = 'void';
    e.voidedAt = new Date().toISOString();
    e.voidReason = 'Voided manually in Recheck';
  }
  haptic(18);
  await saveVehicleRemote({ ...v, paymentLog: log });
}
async function handleArchiveToggle(id) {
  const v = vehicles.find(x => x.id === id);
  if (!v) return;
  haptic(15);
  await saveVehicleRemote({ ...v, active: !v.active });
}

}
async function handleRestoreVehicle(id) {

  if (!v) return;

}
async function handlePermanentDelete(id) {
  haptic([20, 40, 20]);
  await deleteVehicleRemote(id);
  delete ui.confirmDelete[id];
}
async function purgeOldTrash() {
  const cutoff = Date.now() - 30 * 24 * 60 * 60 * 1000;
  const toPurge = vehicles.filter(v => v.deletedAt && new Date(v.deletedAt).getTime() < cutoff);
  for (const v of toPurge) {
    try { await deleteVehicleRemote(v.id); } catch (e) { /* will retry next load */ }
  }
}
async function submitAddForm() {
  const num = document.getElementById('f_new_vehicleNo').value.trim().toUpperCase();
  if (!num) { ui.addError = 'Enter a vehicle number.'; haptic([15, 40, 15]); render(); return; }
  if (vehicles.some(v => v.vehicleNo === num)) { ui.addError = 'That vehicle number is already tracked.'; haptic([15, 40, 15]); render(); return; }
  const v = readVehicleFormFromDOM('new');
  v.id = makeId(); v.active = true; v.vehicleNo = num;
  await saveVehicleRemote(v);
  haptic(20);
  ui.addOpen = false; ui.addError = ''; delete lifetimeOverride['new'];
  render();
}
const uploadingFor = {}; // vehicleId -> true while an upload is in flight
const uploadError = {}; // vehicleId -> error message
const pendingUpload = {}; // `${vehicleId}_${folderKey}` -> { file, name } — awaiting rename confirmation

const MONTH_ABBR_SHORT = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEPT','OCT','NOV','DEC'];
function getFileExt(filename) {
  const m = /\.[a-zA-Z0-9]+$/.exec(filename || '');
  return m ? m[0] : '';
}
function suggestDocName(vehicleNo, file) {
  const ext = getFileExt(file.name);
  const now = new Date();
  const mon = MONTH_ABBR_SHORT[now.getMonth()];
  const yy = String(now.getFullYear()).slice(-2);
  return `${vehicleNo}-${mon}${yy}${ext}`;
}

async function handleConfirmUpload(vehicleId, folderKey) {
  if (!isModerator()) return;
  const key = `${vehicleId}_${folderKey}`;
  const pending = pendingUpload[key];
  if (!pending) return;
  const inputEl = document.getElementById(`f_${vehicleId}_${folderKey}_rename_input`);
  let chosenName = (inputEl ? inputEl.value.trim() : '') || pending.name;
  const ext = getFileExt(pending.file.name);
  if (ext && !chosenName.toLowerCase().endsWith(ext.toLowerCase())) chosenName += ext;
  delete pendingUpload[key];
  await handleUploadDocument(vehicleId, pending.file, folderKey, chosenName);
}
function handleCancelUpload(vehicleId, folderKey) {
  delete pendingUpload[`${vehicleId}_${folderKey}`];
  render();
}

async function handleUploadDocument(vehicleId, file, category, displayName) {
  if (!file || !isModerator()) return;
  if (file.size > MAX_UPLOAD_BYTES) {
    uploadError[vehicleId] = `"${file.name}" is over 10MB — compress it or take a lighter-quality photo.`;
    haptic([15, 40, 15]);
    render();
    return;
  }
  uploadingFor[vehicleId] = true;
  uploadError[vehicleId] = '';
  render();
  try {
    const form = new FormData();
    form.append('file', file);
    form.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`, {
      method: 'POST',
      body: form,
    });
    if (!res.ok) throw new Error('Cloudinary upload failed: ' + res.status);
    const data = await res.json();
    const v = vehicles.find(x => x.id === vehicleId);
    const docs = (v.documents || []).concat([{
      name: displayName || file.name, url: data.secure_url, path: data.public_id, uploadedAt: new Date().toISOString(),
      category: category || 'receipt',
    }]);
    await saveVehicleRemote({ ...v, documents: docs });
    haptic(18);
  } catch (e) {
    uploadError[vehicleId] = 'Upload failed — check your connection and Cloudinary settings, then try again.';
    haptic([15, 40, 15]);
  } finally {
    uploadingFor[vehicleId] = false;
    render();
  }
}
async function handleDeleteDocument(vehicleId, path) {
  // Unsigned uploads can't be deleted from Cloudinary client-side (needs a signed request).
  // This removes it from the app's list; the file itself stays in your free Cloudinary storage, unused.
  const v = vehicles.find(x => x.id === vehicleId);
  if (!v) return;
  haptic(20);
  const docs = (v.documents || []).filter(d => d.path !== path);
  await saveVehicleRemote({ ...v, documents: docs });
}

async function handlePayDue(vehicleNo, btnEl) {
  const originalText = btnEl ? btnEl.textContent : '';
  try {
    await navigator.clipboard.writeText(vehicleNo);
    if (btnEl) btnEl.textContent = '✓ Number copied — opening VAHAN…';
  } catch (e) {
    if (btnEl) btnEl.textContent = `Copy failed — number is ${vehicleNo}`;
  }
  haptic(15);
  window.open('https://vahan.parivahan.gov.in/vahanservice/vahan/', '_blank', 'noopener');
  if (btnEl) setTimeout(() => { btnEl.textContent = originalText; }, 3000);
}
async function handleCopyChassis(chassisNo, btnEl) {
  const originalText = btnEl ? btnEl.textContent : '';
  try {
    await navigator.clipboard.writeText(chassisNo);
    if (btnEl) btnEl.textContent = '✓ Copied — switch back to VAHAN and paste';
  } catch (e) {
    if (btnEl) btnEl.textContent = `Copy failed — it's ${chassisNo}`;
  }

  if (btnEl) setTimeout(() => { btnEl.textContent = originalText; }, 3000);
}
// Live hint under the tax row: "₹4,500 tax + ₹1,000 penalty = ₹5,500 will be logged".
function updatePenaltyTotal(id) {
  const out = document.getElementById(`f_${id}_tax_penalty_total`);
  const on = document.getElementById(`f_${id}_tax_penalty_on`);
  if (!out || !on) return;
  const tax = Number((document.getElementById(`f_${id}_tax_amount`) || {}).value) || 0;
  const pen = Number((document.getElementById(`f_${id}_tax_penalty`) || {}).value) || 0;
  if (!on.checked) { out.style.display = 'none'; return; }
  out.style.display = 'block';
  out.textContent = pen > 0 ? `Will log ${formatINR(tax)} tax + ${formatINR(pen)} penalty = ${formatINR(tax + pen)}` : 'Enter the penalty amount';
}
function quickRenew(id, field, months, btnEl) {
  const dateInput = document.getElementById(`f_${id}_${field}_date`);
  if (!dateInput) return;
  const previousValue = dateInput.value;
  dateInput.value = addMonthsClampEOM(dateInput.value || todayStr(), months);
  haptic(14);
  if (btnEl) {
    btnEl.dataset.prevValue = previousValue;
    btnEl.dataset.action = 'undo-quick-renew';
    btnEl.textContent = '↩ Undo';
    btnEl.style.borderStyle = 'solid';
    btnEl.style.color = '#F2A93B';
    btnEl.style.borderColor = '#F2A93B';
  }
}
function undoQuickRenew(id, field, months, quickLabel, btnEl) {
  const dateInput = document.getElementById(`f_${id}_${field}_date`);
  if (!dateInput || !btnEl) return;
  dateInput.value = btnEl.dataset.prevValue || '';
  delete btnEl.dataset.prevValue;
  haptic(10);
  btnEl.dataset.action = 'quick-renew';
  btnEl.textContent = `↻ ${quickLabel}`;
  btnEl.style.borderStyle = 'dashed';
  btnEl.style.color = '#8A93A3';
  btnEl.style.borderColor = '#3A4553';
}
function exportBackup() {
  const json = JSON.stringify({ kind: 'fleet-compliance-backup', exportedAt: new Date().toISOString(), vehicles }, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `fleet-backup-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  haptic(15);
}

function csvEscape(value) {
  const s = value == null ? '' : String(value);
  if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function exportCsv() {
  const headers = ['Vehicle No','Vehicle Name','Chassis No','Status','Current Status','Tax Due Date','Tax Amount','Tax Lifetime','Tax Penalty (pending)','Insurance Due Date','Insurance Amount','Fitness Due Date','Fitness Amount','PUC Due Date','PUC Amount','Permit Due Date','Permit Amount','Permit Type','Permit No','On Hold','Notes'];
  const rows = vehicles.filter(v => !v.deletedAt).map(v => {
    const worst = getVehicleWorstStatus(v);
    const pm = v.permit && v.permit.enabled ? v.permit : null;
    return [
      v.vehicleNo,
      v.name || '',
      v.chassisNo || '',
      v.active ? 'Active' : 'Archived',
      worst.level === 'unset' ? 'No dates set' : `${worst.typeLabel} - ${worst.label}`,
      v.tax.isLifetime ? '' : (v.tax.dueDate || ''),
      v.tax.isLifetime ? '' : (v.tax.amount ?? ''),
      v.tax.isLifetime ? 'Yes' : 'No',
      v.tax.isLifetime ? '' : (v.tax.penalty ?? ''),
      v.insurance.dueDate || '',
      v.insurance.amount ?? '',
      v.fitness.dueDate || '',
      v.fitness.amount ?? '',
      v.puc.dueDate || '',
      v.puc.amount ?? '',
      pm ? (pm.dueDate || '') : '',
      pm ? (pm.amount ?? '') : '',
      pm ? (pm.type || '') : '',
      pm ? (pm.number || '') : '',
      typesFor(v).filter(t => v[t.key] && v[t.key].hold).map(t => t.short).join('; '),
      v.notes || '',
    ].map(csvEscape).join(',');
  });
  const csv = [headers.map(csvEscape).join(','), ...rows].join('\r\n');
  // Leading BOM so Excel opens it as UTF-8 instead of mangling the ₹/non-ASCII text.
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `fleet-compliance-${todayStr()}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  haptic(15);
}

function handleRefreshApp(btn) {
  haptic(10);
  const icon = btn && btn.querySelector('.refresh-icon');
  if (icon) icon.style.animation = 'spin 0.5s linear';
  setTimeout(() => {
    const url = new URL(window.location.href);
    url.searchParams.set('_r', Date.now()); // cache-bust so this always fetches the live index.html, not a cached shell
    window.location.href = url.toString();
  }, 220);
}

// ---------------- event delegation ----------------
root.addEventListener('click', (e) => {
  if (ui.menuOpen && !e.target.closest('.menu-wrap')) { ui.menuOpen = false; render(); }
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  haptic(6); // a light tap on every actionable press, native-app style
  const action = btn.dataset.action;
  const id = btn.dataset.id;
  if (EDIT_ACTIONS.includes(action) && !isModerator()) return; // view-only login
  if (action === 'toggle-expand') { handleToggleExpand(id, btn.dataset.section || ''); }
  else if (action === 'toggle-hold') { toggleHold(btn); }
  else if (action === 'sign-out') { ui.menuOpen = false; handleSignOut(); }
  else if (action === 'toggle-pw') {
    const pw = document.getElementById('login-password');
    if (pw) { const show = pw.type === 'password'; pw.type = show ? 'text' : 'password'; btn.textContent = show ? 'Hide' : 'Show'; }
  }
  else if (action === 'toggle-section') { const k = btn.dataset.key; ui.collapsedSections.has(k) ? ui.collapsedSections.delete(k) : ui.collapsedSections.add(k); render(); }
  else if (action === 'toggle-filter') { ui.filter = (ui.filter === btn.dataset.filter) ? 'all' : btn.dataset.filter; render(); }
  else if (action === 'toggle-add') { ui.addOpen = !ui.addOpen; ui.addError=''; render(); }
  else if (action === 'toggle-menu') { ui.menuOpen = !ui.menuOpen; render(); }
  else if (action === 'save-vehicle') { handleSaveVehicle(id); }
  else if (action === 'archive-toggle') { handleArchiveToggle(id); }
  else if (action === 'delete-request') { ui.confirmDelete[id] = true; render(); }
  else if (action === 'delete-cancel') { delete ui.confirmDelete[id]; render(); }
  else if (action === 'delete-confirm') { handleDeleteConfirmed(id); }
  else if (action === 'restore-vehicle') { handleRestoreVehicle(id); }
  else if (action === 'delete-forever') { handlePermanentDelete(id); }
  else if (action === 'reset-log-request') { ui.confirmResetLog[id] = true; render(); }
  else if (action === 'reset-log-cancel') { delete ui.confirmResetLog[id]; render(); }
  else if (action === 'reset-log-confirm') { handleResetPaymentLog(id); }
  else if (action === 'open-spend') { navigateTo('spend'); }
  else if (action === 'open-recheck') { navigateTo('recheck'); }
  else if (action === 'open-spend-months') { navigateTo('spend-months'); }
  else if (action === 'open-month') { navigateTo('month-detail', { monthKey: btn.dataset.month }); }
  else if (action === 'open-spend-vehicles') { navigateTo('spend-vehicles'); }
  else if (action === 'open-vehicle-spend') { navigateTo('vehicle-spend', { vehicleId: id }); }
  else if (action === 'toggle-void') { handleToggleVoidEntry(id, Number(btn.dataset.idx)); }
  else if (action === 'share-dues') { handleShareDues(); }
  else if (action === 'enable-notifications') { ui.menuOpen = false; handleEnableNotifications(); }
  else if (action === 'pay-due') { handlePayDue(btn.dataset.vehicleNo, btn); }
  else if (action === 'copy-chassis') { handleCopyChassis(btn.dataset.chassis, btn); }
  else if (action === 'quick-renew') { quickRenew(id, btn.dataset.field, Number(btn.dataset.months), btn); }
  else if (action === 'undo-quick-renew') { undoQuickRenew(id, btn.dataset.field, Number(btn.dataset.months), btn.dataset.label, btn); }
  else if (action === 'add-submit') { submitAddForm(); }
  else if (action === 'export-backup') { exportBackup(); }
  else if (action === 'export-csv') { exportCsv(); }
  else if (action === 'refresh-app') { handleRefreshApp(btn); }
  else if (action === 'open-documents') { navigateTo('documents', { vehicleId: id }); }
  else if (action === 'open-folder') { navigateTo('folder', { vehicleId: id, folder: btn.dataset.folder }); }
  else if (action === 'nav-back') { navigateBack(); }
  else if (action === 'upload-trigger') { const inp = document.getElementById(btn.dataset.inputId); if (inp) inp.click(); }
  else if (action === 'confirm-upload') { handleConfirmUpload(id, btn.dataset.folder); }
  else if (action === 'cancel-upload') { handleCancelUpload(id, btn.dataset.folder); }
  else if (action === 'delete-document') { handleDeleteDocument(id, btn.dataset.path); }
  else if (action === 'download-document') { handleDownloadDocument(btn.dataset.url, btn.dataset.name, btn); }
});

async function handleDownloadDocument(url, name, btnEl) {
  const originalText = btnEl ? btnEl.textContent : '';
  if (btnEl) btnEl.textContent = '⬇ Downloading…';
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error('fetch failed');
    const blob = await res.blob();
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    a.download = name || 'document';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(blobUrl), 2000);
  } catch (e) {
    // Fallback: open it directly if the fetch/blob approach fails for any reason
    window.open(url, '_blank');
  } finally {
    if (btnEl) btnEl.textContent = originalText;
  }
}

function computeAnnualSpend(year) {
  const perVehicle = [];
  const byType = { tax: 0, penalty: 0, insurance: 0, fitness: 0, puc: 0, permit: 0 };
  let total = 0;
  for (const v of vehicles) {
    if (v.deletedAt) continue;
    let vTotal = 0;
    for (const entry of (v.paymentLog || [])) {
      if (entry.status === 'void') continue;
      const entryYear = new Date(entry.loggedAt).getFullYear();
      if (entryYear !== year) continue;
      vTotal += entry.amount;
      const pen = entry.type === 'tax' && entry.penalty > 0 ? entry.penalty : 0; // penalty shown on its own line
      byType[entry.type] = (byType[entry.type] || 0) + entry.amount - pen;
      byType.penalty += pen;
      total += entry.amount;
    }
    if (vTotal > 0) perVehicle.push({ vehicleNo: v.vehicleNo, total: vTotal });
  }
  perVehicle.sort((a, b) => b.total - a.total);
  return { total, byType, perVehicle };
}
function formatINR(n) { return '₹' + Math.round(n).toLocaleString('en-IN'); }
function computeStatusTotal(level) {
  let total = 0;
  let count = 0;
  for (const v of vehicles.filter(x => x.active && !x.deletedAt)) {
    for (const { key } of typesFor(v)) {
      const s = getComplianceStatus(v, key);
      if (s.level !== level) continue;
      const amt = v[key] && v[key].amount;
      if (amt != null) { total += amt; count++; }
    }
  }
  return { total, count };
}
function renderFilterTotalBanner(level) {
  const { total, count } = computeStatusTotal(level);
  if (count === 0) return '';
  const label = level === 'overdue' ? 'Overdue' : 'Due within 30 days';
  return `<div class="filter-total-banner${level === 'overdue' ? ' overdue' : ''}">💰 ${label}: <strong>${formatINR(total)}</strong> across ${count} item${count === 1 ? '' : 's'}</div>`;
}
// Entries worth a second look: voided, amount-edited, saved again for the same period,
// or several active payments of the same type for one vehicle in one month.
function computeRecheckItems() {
  const items = [];
  for (const v of vehicles) {
    if (v.deletedAt) continue;
    const log = v.paymentLog || [];
    const groups = {};
    log.forEach((e, i) => {
      if (e.status === 'void') return;
      const k = `${e.type}|${monthKeyFromIso(e.loggedAt)}`;
      (groups[k] = groups[k] || []).push(i);
    });
    log.forEach((e, i) => {
      const reasons = [];
      if (e.status === 'void') reasons.push({ text: `Voided — ${e.voidReason || 'reversed'}`, void: true });
      if (e.edits > 0) reasons.push({ text: `Amount edited ${e.edits}×` });
      if (e.resaves > 0) reasons.push({ text: `Saved again ${e.resaves}× for the same due date` });
      const g = groups[`${e.type}|${monthKeyFromIso(e.loggedAt)}`];
      if (e.status !== 'void' && g && g.length > 1) reasons.push({ text: `${g.length} ${e.label} payments logged this month` });
      if (reasons.length) items.push({ vehicle: v, idx: i, entry: e, reasons });
    });
  }
  items.sort((a, b) => new Date(b.entry.loggedAt) - new Date(a.entry.loggedAt));
  return items;
}

function formatMonthKey(key) {
  const [y, m] = key.split('-').map(Number);
  return `${MONTH_FULL[m - 1]} ${y}`;
}
function collectActiveEntries() {
  const out = [];
  for (const v of vehicles) {
    if (v.deletedAt) continue;
    (v.paymentLog || []).forEach((entry, idx) => {
      if (entry.status !== 'void') out.push({ vehicle: v, idx, entry });
    });
  }
  return out;
}
// Every month (newest first) from the earliest payment — or January of this year, whichever is
// earlier — through the current month. Months with no payments show as ₹0.
function computeMonthlySpend() {
  const map = {};
  for (const { entry } of collectActiveEntries()) {
    const k = monthKeyFromIso(entry.loggedAt);
    const m = map[k] || (map[k] = { key: k, total: 0, count: 0 });
    m.total += entry.amount;
    m.count += 1;
  }
  const now = new Date();
  const curKey = `${now.getFullYear()}-${pad2(now.getMonth() + 1)}`;
  const janKey = `${now.getFullYear()}-01`;
  const existing = Object.keys(map).sort();
  const startKey = existing.length && existing[0] < janKey ? existing[0] : janKey;
  let [y, m] = startKey.split('-').map(Number);
  while (`${y}-${pad2(m)}` <= curKey) {
    const k = `${y}-${pad2(m)}`;
    if (!map[k]) map[k] = { key: k, total: 0, count: 0 };
    m += 1;
    if (m > 12) { m = 1; y += 1; }
  }
  return Object.values(map).sort((a, b) => b.key.localeCompare(a.key));
}
function computeLifetimeByVehicle() {
  const rows = vehicles.filter(v => !v.deletedAt).map(v => {
    let total = 0, count = 0;
    for (const e of (v.paymentLog || [])) {
      if (e.status === 'void') continue;
      total += e.amount;
      count += 1;
    }
    return { vehicle: v, total, count };
  });
  rows.sort((a, b) => b.total - a.total || a.vehicle.vehicleNo.localeCompare(b.vehicle.vehicleNo));
  return rows;
}

function generateWeeklyDuesText() {
  const overdueLines = [];
  const dueLines = [];
  for (const v of vehicles.filter(x => x.active && !x.deletedAt)) {
    for (const { key, label } of typesFor(v)) {
      const s = getComplianceStatus(v, key);
      const amt = v[key] && v[key].amount != null ? ` (${formatINR(v[key].amount)})` : '';
      if (s.level === 'overdue') {
        overdueLines.push(`• ${vehicleLabel(v)} — ${label} ${s.label}${amt}`);
      } else if (s.level === 'soon' && s.days <= 7) {
        const dd = v[key].dueDate ? `, ${formatDateDisplay(v[key].dueDate)}` : '';
        dueLines.push(`• ${vehicleLabel(v)} — ${label} due in ${s.days}d${amt}${dd}`);
      }
    }
  }
  let body = `🚛 Fleet Compliance — Due This Week\n(as of ${formatDateDisplay(todayStr())})\n`;
  if (overdueLines.length) body += `\n⚠️ OVERDUE:\n${overdueLines.join('\n')}\n`;
  if (dueLines.length) body += `\n📅 DUE WITHIN 7 DAYS:\n${dueLines.join('\n')}\n`;
  if (!overdueLines.length && !dueLines.length) body += `\n✅ Nothing overdue or due within 7 days. All clear!\n`;
  return body;
}
async function handleEnableNotifications() {
  notifError = '';
  notifSuccessMsg = '';
  notifDebugLines = [];
  if (!messaging) { notifStatus = 'unsupported'; render(); return; }
  notifDebugLines.push('Requesting notification permission…');
  render();
  try {
    const permission = await Notification.requestPermission();
    notifStatus = permission;
    notifDebugLines.push(`Permission result: ${permission}`);
    render();
    if (permission !== 'granted') {
      notifDebugLines.push(permission === 'denied'
        ? 'Blocked — enable notifications for this app in your phone/browser settings, then retry.'
        : 'Dismissed without choosing — tap the button again to retry.');
      render();
      return;
    }
    notifDebugLines.push('Registering service worker (firebase-messaging-sw.js)…');
    render();
    const registration = await navigator.serviceWorker.register('firebase-messaging-sw.js');
    await navigator.serviceWorker.ready;
    notifDebugLines.push('Service worker ready. Requesting FCM token…');
    render();
    const token = await getToken(messaging, { vapidKey: FCM_VAPID_KEY, serviceWorkerRegistration: registration });
    if (!token) {
      notifDebugLines.push('No token returned by Firebase.');
      notifError = 'No token came back from Firebase — permission was granted but registration didn\u2019t complete. Try closing and reopening the app, or reinstalling it from the browser menu.';
      render();
      return;
    }
    notifDebugLines.push(`Token received (…${token.slice(-10)}). Saving to Firestore…`);
    render();
    await setDoc(doc(deviceTokensCol, token), { token, registeredAt: new Date().toISOString() });
    notifDebugLines.push('Saved to Firestore \u2713');
    notifSuccessMsg = `This device is registered for push notifications (token ending …${token.slice(-10)}). It'll get today's alert the next time the daily check runs at 9am IST — or tap "Run workflow" on the GitHub Actions tab to test immediately.`;
    haptic(20);
  } catch (e) {
    notifDebugLines.push(`Error: ${e.name || 'Error'} — ${e.message || String(e)}`);
    notifError = `${e.name || 'Error'}: ${e.message || String(e)}`;
    console.error('Notification setup failed:', e);
  }
  render();
}
async function handleShareDues() {
  const text = generateWeeklyDuesText();
  haptic(15);
  if (navigator.share) {
    try { await navigator.share({ text }); return; } catch (e) { /* cancelled or unsupported — fall through */ }
  }
  try {
    await navigator.clipboard.writeText(text);
    shareState.text = text; shareState.mode = 'copied';
  } catch (e) {
    shareState.text = text; shareState.mode = 'fallback';
  }
  render();
  if (shareState.mode === 'copied') setTimeout(() => { shareState.text = ''; shareState.mode = ''; render(); }, 4000);
}
function renderNotifMenuItem() {
  if (notifStatus === 'checking') return `<button type="button" class="menu-item" disabled>Checking notification support…</button>`;
  if (notifStatus === 'unsupported') return `<button type="button" class="menu-item" disabled>🔕 Notifications not supported here</button>`;
  if (notifStatus === 'granted' && !notifError) return `<button type="button" class="menu-item" data-action="enable-notifications">🔔 Notifications on (tap to re-check)</button>`;
  if (notifStatus === 'denied') return `<button type="button" class="menu-item" disabled>🔕 Blocked — check phone settings</button>`;
  const label = notifStatus === 'granted' ? '🔔 Retry registration' : '🔔 Enable Notifications';
  return `<button type="button" class="menu-item" data-action="enable-notifications">${label}</button>`;

  </div>`;
}

const SECTION_ICONS = { tax: '🧾', insurance: '🛡️', fitness: '📜', puc: '💨', permit: '🚚' };
// Overdue / Due-within-30-days view: one collapsible folder per compliance type. A vehicle with two
// items in the same state appears once in each folder (each row shows that folder's item only).
function renderTypeSections(level, pool) {
  const q = ui.search.trim().toLowerCase();
  const matches = v => !q || v.vehicleNo.toLowerCase().includes(q) || (v.chassisNo || '').toLowerCase().includes(q) || (v.name || '').toLowerCase().includes(q);
  const sections = [];
  for (const t of COMPLIANCE_TYPES) {
    const items = [];
    for (const v of pool) {
      if (!matches(v) || !typesFor(v).some(x => x.key === t.key)) continue;
      const st = getComplianceStatus(v, t.key);
      if (st.level !== level) continue;
      items.push({ v, st, amt: v[t.key] && v[t.key].amount != null ? v[t.key].amount : null });
    }
    if (!items.length) continue;
    items.sort((a, b) => (a.st.days ?? Infinity) - (b.st.days ?? Infinity));
    sections.push({ t, items });
  }
  if (!sections.length) return `<div class="empty-state">${emptyStateMessage(level, ui.search)}</div>`;
  return sections.map(({ t, items }) => {
    const key = `${level}:${t.key}`;
    const open = !ui.collapsedSections.has(key);
    const withAmt = items.filter(i => i.amt != null);
    const total = withAmt.reduce((sum, i) => sum + i.amt, 0);
    return `<div class="type-section">
      <button type="button" class="folder-tile section-${level}" data-action="toggle-section" data-key="${key}">
        <div class="folder-icon">${SECTION_ICONS[t.key] || '📁'}</div>
        <div class="folder-info">
          <div class="folder-label">${t.label}</div>
          <div class="folder-hint">${withAmt.length ? `${formatINR(total)} total` : 'No amounts saved'}</div>
        </div>
        <div class="folder-count">${items.length}</div>
        <div class="folder-chevron section-chev${open ? ' open' : ''}">›</div>
      </button>
      ${open ? `<div class="section-body">${items.map(({ v }) => renderVehicleRow(v, t.key)).join('')}</div>` : ''}
    </div>`;
  }).join('');
}
function renderStatGrid(c) {
  return `<div class="stat-grid">
      ${renderStatBlock('All vehicles', c.all, '#C3CAD4', 'everything')}
      ${renderStatBlock('Overdue', c.overdue, '#E5484D', 'overdue')}
      ${renderStatBlock('Due ≤ 30 days', c.soon, '#F2A93B', 'soon')}
      ${renderStatBlock('Needs info', c.missing, '#5B9FE3', 'missing')}
      ${renderStatBlock('Archived', c.archived, '#5B6472', 'archived')}
      ${renderStatBlock('Trash', c.trash, '#E5484D', 'trash')}
    </div>`;
}
function renderApp(anim = '') {
  const activeVehicles = vehicles.filter(v => v.active && !v.deletedAt);
  const archivedVehicles = vehicles.filter(v => !v.active && !v.deletedAt);
  const trashVehicles = vehicles.filter(v => v.deletedAt).sort((a,b) => new Date(b.deletedAt) - new Date(a.deletedAt));
  const overdueCount = activeVehicles.filter(v => getVehicleWorstStatus(v).level === 'overdue').length;
  const soonCount = activeVehicles.filter(v => getVehicleWorstStatus(v).level === 'soon').length;
  const missingCount = activeVehicles.filter(hasMissingInfo).length;
  const statGrid = renderStatGrid({ all: activeVehicles.length + archivedVehicles.length, overdue: overdueCount, soon: soonCount, missing: missingCount, archived: archivedVehicles.length, trash: trashVehicles.length });

  if (ui.filter === 'trash') {
    return `<div class="wrap ${anim}">
      <header>
        <div class="header-row"><h1 class="title">FLEET COMPLIANCE LOG</h1><div style="display:flex;align-items:center;gap:10px">${renderSyncBadge()}${renderRefreshButton()}${renderHeaderMenu()}</div></div>
        <p class="subtitle">${activeVehicles.length} active · ${archivedVehicles.length} archived · shared live with everyone signed in</p>
      </header>
      ${statGrid}
      <div class="vehicle-list">
        ${trashVehicles.length === 0 ? `<div class="empty-state">Trash is empty.</div>` : trashVehicles.map(renderTrashRow).join('')}
      </div>
    </div>`;
  }

  const pool = ui.filter === 'archived' ? archivedVehicles
    : ui.filter === 'everything' ? activeVehicles.concat(archivedVehicles)
    : activeVehicles;
  const filtered = pool.filter(v => {
    if (ui.filter === 'overdue' && getVehicleWorstStatus(v).level !== 'overdue') return false;
    if (ui.filter === 'soon' && getVehicleWorstStatus(v).level !== 'soon') return false;
    if (ui.filter === 'missing' && !hasMissingInfo(v)) return false;
    if (ui.search.trim()) {
      const q = ui.search.trim().toLowerCase();
      if (!v.vehicleNo.toLowerCase().includes(q) && !(v.chassisNo||'').toLowerCase().includes(q) && !(v.name||'').toLowerCase().includes(q)) return false;
    }
    return true;
  }).sort((a,b) => {
    if (a.active !== b.active) return a.active ? -1 : 1; // 'All vehicles' lists active first, archived after
    const wa = getVehicleWorstStatus(a), wb = getVehicleWorstStatus(b);
    if (STATUS_RANK[wa.level] !== STATUS_RANK[wb.level]) return STATUS_RANK[wa.level]-STATUS_RANK[wb.level];
    return (wa.days ?? Infinity) - (wb.days ?? Infinity);
  });

  return `<div class="wrap ${anim}">
    <header>
      <div class="header-row"><h1 class="title">FLEET COMPLIANCE LOG</h1><div style="display:flex;align-items:center;gap:10px">${renderSyncBadge()}${renderRefreshButton()}${renderHeaderMenu()}</div></div>
      <p class="subtitle">${activeVehicles.length} active · ${archivedVehicles.length} archived · shared live with everyone signed in</p>
    </header>
    ${statGrid}
    <div class="quick-actions">
      <button type="button" class="btn btn-outline quick-action-btn" data-action="open-spend">💰 Annual Spend</button>
      <button type="button" class="btn btn-outline quick-action-btn" data-action="share-dues">📤 Share this week's dues</button>
    </div>
    ${notifSuccessMsg ? `<div class="notif-success">🔔 ${escapeHtml(notifSuccessMsg)}</div>` : ''}
    ${notifError ? `<div class="error-text" style="margin-bottom:12px">🔔 ${escapeHtml(notifError)}</div>` : ''}
    ${renderNotifDebug()}
    ${foregroundNotice ? `<div class="foreground-notice">🔔 ${escapeHtml(foregroundNotice)}</div>` : ''}
    ${shareState.text ? renderShareFallback() : ''}
    <div class="search-wrap">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search-input" class="text-input" placeholder="Search by name, vehicle or chassis number" value="${escapeHtml(ui.search)}"/>
    </div>
    <div class="vehicle-list">
      ${(ui.filter === 'overdue' || ui.filter === 'soon')
        ? `${renderFilterTotalBanner(ui.filter)}${renderTypeSections(ui.filter, activeVehicles)}`
        : (filtered.length === 0 ? `<div class="empty-state">${emptyStateMessage(ui.filter, ui.search)}</div>` : filtered.map(v => renderVehicleRow(v)).join(''))}
    </div>
    <div style="margin-top:14px">${renderAddForm()}</div>
    <div class="backup-note">
      <span>Want a local safety-net copy?</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-outline" data-action="export-backup">⬇ JSON backup</button>
        <button class="btn btn-outline" data-action="export-csv">⬇ CSV</button>
      </div>
    </div>
    <div class="legend">
      <span class="legend-item"><span class="legend-dot" style="background:#E5484D"></span>Overdue</span>
      <span class="legend-item"><span class="legend-dot" style="background:#F2A93B"></span>Due ≤ 30d</span>
      <span class="legend-item"><span class="legend-dot" style="background:#5B9FE3"></span>Due ≤ 90d</span>
      <span class="legend-item"><span class="legend-dot" style="background:#3FB27F"></span>On track / Lifetime</span>
      <span class="legend-item"><span class="legend-dot" style="background:#5B6472"></span>Not set</span>
      <span class="legend-item"><span class="legend-dot" style="background:#9B8CFF"></span>On hold</span>
    </div>
  </div>`;
}

// ---------------- init ----------------
// A saved session on this device opens the app straight away; otherwise the password screen shows.
// Nothing is loaded from the database until someone is in.
(function startup() {
  const role = loadSession();
  if (role) enterApp(role);
  else { authState = 'signedOut'; render(); }
})();
</script>
</body>
</html>
